name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Validate compose files
        run: |
          docker compose --profile monolith config -q
          docker compose --profile microservices config -q

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "logpulse:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with: { context: ., file: frontend/Dockerfile, load: true, tags: "logpulse-gateway:${{ github.sha }}" }
      - name: Smoke test (container boots and /health answers)
        run: |
          docker run -d --name smoke -p 8000:8000 logpulse:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs smoke; exit 1
      - name: Package deploy-ready artifact
        run: |
          docker save logpulse:${{ github.sha }} logpulse-gateway:${{ github.sha }} | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: docker-images, path: images.tar.gz, retention-days: 7 }

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Push app image
        uses: docker/build-push-action@v6
        with: { context: ., push: true, tags: "ghcr.io/${{ github.repository }}/app:latest,ghcr.io/${{ github.repository }}/app:${{ github.sha }}" }
      - name: Push gateway image
        uses: docker/build-push-action@v6
        with: { context: ., file: frontend/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository }}/gateway:latest,ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}" }
      # Next step (not implemented): deploy the pushed image to AWS (ECS Fargate / App Runner).
