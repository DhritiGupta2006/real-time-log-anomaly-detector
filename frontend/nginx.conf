# API gateway: serves the dashboard, routes REST + WebSocket to the alerts service.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/    { proxy_pass http://alerts:8003; proxy_set_header Host $host; }
  location = /health { proxy_pass http://alerts:8003; }
  location /ws {
    proxy_pass http://alerts:8003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location / { try_files $uri /index.html; }
}
